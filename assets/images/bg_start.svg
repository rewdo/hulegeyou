    <polygon points="680,300 683,310 695,310 686,318 689,328 680,320 671,328 674,318 665,310 677,310"/>
    <polygon points="120,750 123,760 135,760 126,768 129,778 120,770 111,778 114,768 105,760 117,760"/>
